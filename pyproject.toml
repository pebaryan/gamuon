[build-system]
requires = ["setuptools>=64.0", "setuptools_scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gamuon"
dynamic = ["version"]
description = "Geometric (Clifford) Algebra-native Optimizer - a reformulation of Muon using exact rotor updates via bivector exponentials"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Peb Ruswono Aryan", email = "pebryan@users.noreply.github.com"},
]
keywords = [
    "deep-learning",
    "optimizer",
    "geometric-algebra",
    "clifford-algebra",
    "muon",
    "pytorch",
    "matrix-exponential",
    "lie-group",
    "rotor",
    "versor",
    "conformal-geometric-algebra",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# PyTorch is intentionally NOT listed as a hard dependency because it is
# platform-specific (CPU, CUDA, ROCm, MPS variants). Users install PyTorch
# separately via https://pytorch.org/get-started/locally/ then optionally
# install the torch extra:  pip install gamuon[torch]
dependencies = []

[project.urls]
Homepage = "https://github.com/pebaryan/gamuon"
Documentation = "https://github.com/pebaryan/gamuon/blob/main/docs/theory.md"
Source = "https://github.com/pebaryan/gamuon"
"Bug Tracker" = "https://github.com/pebaryan/gamuon/issues"

[project.optional-dependencies]
torch = ["torch>=2.0.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools]
py-modules = ["gamuon"]

[tool.setuptools_scm]
fallback_version = "0.1.0"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]
